<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aulas do módulo</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    main {
      max-width: 960px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .lesson-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lesson-title {
      font-size: 18px;
      font-weight: bold;
      color: #0f172a;
    }

    .lesson-order {
      color: #64748b;
      font-size: 14px;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aulas do módulo</h1>
  </header>

  <main>
    <div class="actions">
      <a href="cursos.html" class="btn">Voltar para cursos</a>
      <button id="btn-voltar-curso" class="btn">Voltar para curso</button>
    </div>

    <div id="message-container"></div>

    <h2 id="module-title">Carregando...</h2>
    <p id="module-meta"></p>

    <div id="lessons-container"></div>
  </main>

  <script src="js/aulas.js"></script>
</body>
</html>
