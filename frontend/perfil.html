<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img src="./assets/logo.png" alt="Logo" class="logo" />
      <span class="brand-name">MatemáticaEssencial</span>
    </div>

    <nav class="topbar-nav">
      <a id="courseNavLink" href="./curso.html" class="nav-btn">Curso</a>
      <a href="./dashboard.html" class="nav-btn">Dashboard</a>
      <button id="logoutButton" class="nav-btn logout-btn" type="button">Sair</button>
    </nav>
  </header>

  <main class="page-container">
    <section class="page-title-section">
      <h1>Perfil</h1>
    </section>

    <section class="profile-card">
      <h2>Dados do aluno</h2>

      <div class="profile-grid">
        <div class="profile-field">
          <label>Nome</label>
          <p id="profileName">-</p>
        </div>

        <div class="profile-field">
          <label>Sobrenome</label>
          <p id="profileLastName">-</p>
        </div>

        <div class="profile-field">
          <label>Email</label>
          <p id="profileEmail">-</p>
        </div>

        <div class="profile-field">
          <label>Perfil</label>
          <p id="profileRole">-</p>
        </div>
      </div>

      <button type="button" class="secondary-btn">Editar perfil</button>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/perfil.js"></script>
</body>
</html>
