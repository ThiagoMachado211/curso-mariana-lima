<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil do Aluno</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="student-page">
    <header class="site-header student-top-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="dashboard.html" class="site-logo">
            <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <a href="curso.html" class="btn btn--dark">Curso</a>
            <a href="dashboard.html" class="btn btn--dark">Dashboard</a>
            <button id="logoutButton" class="btn btn--dark" type="button">Sair</button>
          </nav>
        </div>
      </div>
    </header>

    <main class="student-main">
      <div class="student-container">
        <h1 class="student-page-title">Perfil</h1>

        <div id="messageBox" class="student-message"></div>

        <section class="student-card" id="profileCard">
          <h2>Dados do aluno</h2>

          <div class="student-profile-grid">
            <div class="student-profile-item">
              <span class="student-profile-label">Nome</span>
              <span class="student-profile-value" id="profileName">-</span>
            </div>

            <div class="student-profile-item">
              <span class="student-profile-label">Sobrenome</span>
              <span class="student-profile-value" id="profileLastName">-</span>
            </div>

            <div class="student-profile-item">
              <span class="student-profile-label">Email</span>
              <span class="student-profile-value" id="profileEmail">-</span>
            </div>

            <div class="student-profile-item">
              <span class="student-profile-label">Perfil</span>
              <span class="student-profile-value" id="profileRole">-</span>
            </div>
          </div>

          <div class="actions" style="margin-top: 18px;">
            <button id="editProfileButton" type="button">Editar perfil</button>
          </div>
        </section>

        <section class="student-card hidden" id="profileFormCard">
          <h2>Editar perfil</h2>

          <form id="profileForm" class="student-form">
            <div class="row">
              <div>
                <label for="name">Nome</label>
                <input type="text" id="name" />
              </div>

              <div>
                <label for="last_name">Sobrenome</label>
                <input type="text" id="last_name" />
              </div>

              <div class="full-width">
                <label for="email">Email</label>
                <input type="email" id="email" />
              </div>
            </div>

            <div class="actions">
              <button type="submit">Salvar alterações</button>
              <button type="button" id="cancelEditProfile" class="secondary">Cancelar</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/perfil.js"></script>
  </body>
</html>
