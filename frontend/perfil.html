<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>

    <header class="site-header student-top-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="dashboard.html" class="site-logo">
            <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <a href="dashboard.html" class="btn btn--dark">Dashboard</a>
            <a href="curso.html" class="btn btn--dark">Curso</a>
            <button id="logoutButton" class="btn btn--dark" type="button">Sair</button>
          </nav>
        </div>
      </div>
    </header>
    

    <main class="profile-page">
      <section class="page-title-section">
        <h1>Perfil</h1>
      </section>

      <section class="profile-card">
        <h2>Dados do aluno</h2>

        <div class="profile-grid">
          <div class="profile-field">
            <label>Nome</label>
            <p id="profileName">-</p>
          </div>

          <div class="profile-field">
            <label>Sobrenome</label>
            <p id="profileLastName">-</p>
          </div>

          <div class="profile-field">
            <label>Email</label>
            <p id="profileEmail">-</p>
          </div>

          <div class="profile-field">
            <label>Perfil</label>
            <p id="profileRole">-</p>
          </div>
        </div>

        <button type="button" class="secondary-btn">Editar perfil</button>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/perfil.js"></script>
  </body>
</html>
