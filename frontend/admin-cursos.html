<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Cursos</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 0;
      color: #0f172a;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 20px;
    }

    .top-actions {
      margin-bottom: 16px;
    }

    .back-link {
      display: inline-block;
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 22px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      gap: 20px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-item input {
      width: auto;
      margin: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #475569;
    }

    .secondary:hover {
      background: #334155;
    }

    .danger {
      background: #dc2626;
    }

    .danger:hover {
      background: #b91c1c;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .courses-grid {
      display: grid;
      gap: 16px;
    }

    .course-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      background: #fff;
    }

    .course-card-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
      flex-wrap: wrap;
    }

    .course-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .course-description {
      color: #64748b;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .course-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-active {
      background: #dcfce7;
      color: #166534;
    }

    .badge-inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-published {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge-draft {
      background: #e2e8f0;
      color: #334155;
    }

    .course-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      color: #64748b;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gerenciamento de Cursos</h1>
  </header>

  <main>
    <div class="top-actions">
      <a class="back-link" href="dashboard.html">← Voltar para o dashboard</a>
    </div>

    <div id="message-container"></div>

    <section class="card">
      <h2 id="form-title">Novo curso</h2>

      <div class="row">
        <div>
          <label for="title">Título</label>
          <input type="text" id="title" />
        </div>

        <div>
          <label for="slug">Slug</label>
          <input type="text" id="slug" />
        </div>

        <div class="full-width">
          <label for="description">Descrição</label>
          <textarea id="description"></textarea>
        </div>

        <div>
          <label for="price_cents">Preço (em centavos)</label>
          <input type="number" id="price_cents" />
        </div>

        <div>
          <label for="currency">Moeda</label>
          <input type="text" id="currency" value="BRL" />
        </div>

        <div class="full-width">
          <div class="checkbox-row">
            <label class="checkbox-item">
              <input type="checkbox" id="is_active" checked />
              <span>Curso ativo</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="is_published" />
              <span>Curso publicado</span>
            </label>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="save-btn">Salvar curso</button>
        <button id="cancel-edit-btn" class="secondary" type="button">Cancelar edição</button>
      </div>
    </section>

    <section class="card">
      <h2>Lista de cursos</h2>
      <div id="courses-container" class="courses-grid"></div>
      <div id="empty-state" class="empty-state" style="display:none;">
        Nenhum curso cadastrado até o momento.
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-cursos.js"></script>
</body>
</html>
