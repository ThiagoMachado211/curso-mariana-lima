<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Cursos</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-page">
    <header class="site-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="index.html" class="site-logo">
            <img
              src="assets/Logo_Mariana.jpg"
              alt="Logo Mariana Lima"
              class="site-logo__img"
            />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática </span
              ><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <a href="admin-dashboard.html" class="btn btn--light">
              Voltar para o dashboard
            </a>
          </nav>
        </div>
      </div>
    </header>

    <main class="admin-management-main">
      <div class="admin-management-container">
        <h1 class="admin-management-title">Gerenciamento de Cursos</h1>

        <div id="messageBox"></div>

        <section class="card">
          <h2 id="formTitle">Novo curso</h2>

          <form id="courseForm">
            <div class="row">
              <div>
                <label for="title">Título</label>
                <input type="text" id="title" />
              </div>

              <div>
                <label for="slug">Slug</label>
                <input type="text" id="slug" />
              </div>

              <div class="full-width">
                <label for="description">Descrição</label>
                <textarea id="description"></textarea>
              </div>

              <div>
                <label for="price_cents">Preço (em centavos)</label>
                <input type="number" id="price_cents" />
              </div>

              <div>
                <label for="currency">Moeda</label>
                <input type="text" id="currency" value="BRL" />
              </div>

              <div class="full-width">
                <label style="display: flex; align-items: center; gap: 8px;">
                  <input
                    type="checkbox"
                    id="is_active"
                    checked
                    style="width: auto;"
                  />
                  Curso ativo
                </label>

                <label
                  style="
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    margin-top: 10px;
                  "
                >
                  <input
                    type="checkbox"
                    id="is_published"
                    style="width: auto;"
                  />
                  Curso publicado
                </label>
              </div>
            </div>

            <div class="actions">
              <button type="submit">Salvar curso</button>
              <button
                id="cancelEditButton"
                class="secondary hidden"
                type="button"
              >
                Cancelar edição
              </button>
            </div>
          </form>
        </section>

        <section class="card">
          <h2>Lista de cursos</h2>
          <div id="coursesList" class="admin-list-stack">
            <p class="empty-state">Nenhum curso cadastrado até o momento.</p>
          </div>
        </section>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-cursos.js"></script>
  </body>
</html>
