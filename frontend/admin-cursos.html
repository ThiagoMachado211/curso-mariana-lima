<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Cursos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>


  
  <body class="admin-page admin-courses-page">
    <header>
      <h1>Gerenciamento de Cursos</h1>
    </header>

    <main>
      <div class="top-actions">
        <a class="back-link" href="dashboard.html">← Voltar para o dashboard</a>
      </div>

      <div id="message-container"></div>

      <section class="card">
        <h2 id="form-title">Novo curso</h2>

        <div class="row">
          <div>
            <label for="title">Título</label>
            <input type="text" id="title" />
          </div>

          <div>
            <label for="slug">Slug</label>
            <input type="text" id="slug" />
          </div>

          <div class="full-width">
            <label for="description">Descrição</label>
            <textarea id="description"></textarea>
          </div>

          <div>
            <label for="price_cents">Preço (em centavos)</label>
            <input type="number" id="price_cents" />
          </div>

          <div>
            <label for="currency">Moeda</label>
            <input type="text" id="currency" value="BRL" />
          </div>

          <div class="full-width">
            <div class="checkbox-row">
              <label class="checkbox-item">
                <input type="checkbox" id="is_active" checked />
                <span>Curso ativo</span>
              </label>

              <label class="checkbox-item">
                <input type="checkbox" id="is_published" />
                <span>Curso publicado</span>
              </label>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="save-btn">Salvar curso</button>
          <button id="cancel-edit-btn" class="secondary" type="button">Cancelar edição</button>
        </div>
      </section>

      <section class="card">
        <h2>Lista de cursos</h2>
        <div id="courses-container" class="courses-grid"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
          Nenhum curso cadastrado até o momento.
        </div>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-cursos.js"></script>
  </body>
</html>
