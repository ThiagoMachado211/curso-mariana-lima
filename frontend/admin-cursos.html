<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Cursos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>


  
  <body class="admin-page admin-dashboard-page">
    <header class="site-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="index.html" class="site-logo">
            <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <a href="admin-dashboard.html" class="btn btn--dark">Voltar para o dashboard</a>
          </nav>
        </div>
      </div>
    </header>


    <main class="admin-management-main">
      <div class="admin-management-container">
        <h1 class="admin-management-title">Gerenciamento de Cursos</h1>

        <div id="messageBox"></div>

        <section class="card">
          <h2 id="form-title">Novo curso</h2>

          <div class="row">
            <div>
              <label for="title">Título</label>
              <input type="text" id="title" />
            </div>

            <div>
              <label for="slug">Slug</label>
              <input type="text" id="slug" />
            </div>

            <div class="full-width">
              <label for="description">Descrição</label>
              <textarea id="description"></textarea>
            </div>

            <div>
              <label for="price_cents">Preço (em centavos)</label>
              <input type="number" id="price_cents" />
            </div>

            <div>
              <label for="currency">Moeda</label>
              <input type="text" id="currency" value="BRL" />
            </div>

            <div class="full-width">
              <div class="checkbox-row">
                <label class="checkbox-item">
                  <input type="checkbox" id="is_active" checked />
                  <span>Curso ativo</span>
                </label>

                <label class="checkbox-item">
                  <input type="checkbox" id="is_published" />
                  <span>Curso publicado</span>
                </label>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="save-btn">Salvar curso</button>
            <button id="cancel-edit-btn" class="secondary" type="button">Cancelar edição</button>
          </div>
        </section>

        <section class="card">
          <h2>Lista de cursos</h2>
          <div id="coursesList" class="admin-list-stack"></div>
          <div id="empty-state" class="empty-state" style="display:none;">
            Nenhum curso cadastrado até o momento.
          </div>
        </section>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-cursos.js"></script>
  </body>
</html>
