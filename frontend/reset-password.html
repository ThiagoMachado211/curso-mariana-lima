<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="public-page auth-page">
    <header class="site-header">
      <div class="page-container site-header__inner">
        <a href="index.html" class="site-logo">
          <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
          <span class="site-logo__text">
            <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
          </span>
        </a>

        <nav class="site-nav">
          <a href="index.html" class="btn btn--dark">Página Inicial</a>
          <a href="login.html" class="btn btn--purple">Entrar</a>
        </nav>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <h1>Redefinir senha</h1>
        <p>Digite sua nova senha para concluir a redefinição.</p>

        <form id="resetPasswordForm">
          <div class="form-field">
            <label class="form-field__label" for="password">Nova senha</label>
            <input class="form-field__input" type="password" id="password" required minlength="6" />
          </div>

          <div class="form-field">
            <label class="form-field__label" for="confirmPassword">Confirmar nova senha</label>
            <input class="form-field__input" type="password" id="confirmPassword" required minlength="6" />
          </div>

          <button type="submit" id="resetPasswordButton" class="btn btn--purple btn--full">
            Redefinir senha
          </button>

          <div id="resetPasswordMessage" class="form-feedback--success"></div>
          <div id="resetPasswordError" class="form-feedback--error"></div>

          <div class="form-footer">
            <a href="login.html">Voltar para login</a>
          </div>
        </form>
      </section>
    </main>

    <script src="js/reset-password.js"></script>
  </body>
</html>
