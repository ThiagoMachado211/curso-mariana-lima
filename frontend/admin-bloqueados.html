<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Usuários Bloqueados</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="index.html" class="site-logo">
            <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática </span><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <a href="admin-dashboard.html" class="btn btn--dark" style="background-color: lightgrey; color: black;">
              Voltar para o dashboard
            </a>
          </nav>
        </div>
      </div>
    </header>

    <main class="admin-page">
      <section class="page-toolbar">
        <div>
          <h2>Usuários bloqueados</h2>
          <p>Visualize, edite e desbloqueie usuários inativos.</p>
        </div>
      </section>

      <section id="feedbackMessage" class="feedback hidden"></section>

      <section class="admin-table-card">
        <div class="admin-table-wrapper">
          <table class="admin-users-table">
            <thead>
              <tr>
                <th>Nome Completo</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="blockedUsersList">
              <tr>
                <td colspan="4" class="empty-state">Carregando usuários bloqueados...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="userModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="userModalTitle">Editar cadastro</h2>
          <button type="button" id="closeUserModalButton" class="icon-close-btn">×</button>
        </div>

        <form id="userForm" class="form-grid">
          <input type="hidden" id="userId" />

          <div class="form-row">
            <label for="name">Nome</label>
            <input type="text" id="name" required />
          </div>

          <div class="form-row">
            <label for="lastName">Sobrenome</label>
            <input type="text" id="lastName" required />
          </div>

          <div class="form-row">
            <label for="email">E-mail</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-row">
            <label for="role">Perfil</label>
            <select id="role" required>
              <option value="student">Aluno</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="form-row">
            <label for="isActive">Status</label>
            <select id="isActive">
              <option value="true">Ativo</option>
              <option value="false">Inativo</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancelUserModalButton" class="secondary-btn">Cancelar</button>
            <button type="submit" id="saveUserButton" class="primary-btn">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/admin-bloqueados.js"></script>
  </body>
</html>
