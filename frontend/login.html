<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Matemática Essencial</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>


  <body class="public-page login-page">
    <header class="site-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="index.html" class="site-logo">
            <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <a href="index.html" class="btn btn--dark">Página Inicial</a>
            <a href="cadastro.html" class="btn btn--dark">Cadastre-se</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="page-center">
      <div class="form-card">
        <h1 class="form-card__title">Entrar</h1>
        <p class="form-card__subtitle">Acesse sua conta para entrar na plataforma.</p>

        <form id="loginForm">
          <div class="form-field">
            <label class="form-field__label" for="email">Email</label>
            <input class="form-field__input" type="email" id="email" required />
          </div>

          <div class="form-field">
            <label class="form-field__label" for="password">Senha</label>

            <div class="password-field">
              <input class="form-field__input" type="password" id="password" required />
              <button type="button" id="togglePassword" class="password-toggle"></button>
            </div>
          </div>

          <button type="submit" class="btn btn--purple btn--full">Entrar</button>

          <div id="loginError" class="form-feedback--error"></div>

          <div class="form-footer">
            Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
          </div>
        </form>
      </div>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/login.js"></script>
  </body>

</html>
