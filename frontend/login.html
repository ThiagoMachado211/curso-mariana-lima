<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Matemática Essencial</title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      min-height: 100%;
      background: #000;
      color: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    .page-container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .site-header {
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.95);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .site-header__inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .site-logo__icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f2f2f2;
      color: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
    }

    .site-logo__text {
      font-size: 18px;
      font-weight: 800;
    }

    .site-logo__text--blue {
      color: #3b82f6;
    }

    .site-logo__text--purple {
      color: #a855f7;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      padding: 0 24px;
      border-radius: 16px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn--dark {
      background: #0a0a0a;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn--dark:hover {
      background: #151515;
    }

    .btn--purple {
      background: linear-gradient(90deg, #9d4edd, #c056f0);
      color: #fff;
      border: 1px solid transparent;
    }

    .btn--purple:hover {
      opacity: 0.95;
    }

    .btn--full {
      width: 100%;
    }

    .login-page {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .form-card {
      width: 100%;
      max-width: 620px;
      background: #050505;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px;
    }

    .form-card__title {
      font-size: 40px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .form-card__subtitle {
      color: #bdbdbd;
      margin-bottom: 24px;
      font-size: 16px;
    }

    .form-field {
      margin-bottom: 18px;
    }

    .form-field__label {
      display: block;
      font-size: 14px;
      margin-bottom: 10px;
      color: #f3f3f3;
      font-weight: 600;
    }

    .form-field__input {
      width: 100%;
      height: 58px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: #0b0b0d;
      color: #fff;
      padding: 0 18px;
      font-size: 18px;
    }

    .form-field__input:focus {
      outline: none;
      border-color: #a855f7;
    }

    .form-feedback--error {
      margin-top: 14px;
      color: #ff5c5c;
      font-size: 14px;
      min-height: 18px;
    }

    .form-footer {
      margin-top: 18px;
      color: #cfcfcf;
      font-size: 14px;
    }

    .form-footer a {
      color: #a855f7;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .site-header__inner {
        min-height: 72px;
        height: auto;
        padding: 16px 0;
        flex-direction: column;
        gap: 16px;
      }

      .site-nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      .form-card {
        padding: 24px;
      }

      .form-card__title {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="page-container site-header__inner">
      <a href="index.html" class="site-logo">
        <div class="site-logo__icon">▶</div>
        <div class="site-logo__text">
          <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
        </div>
      </a>

      <nav class="site-nav">
        <a href="index.html" class="btn btn--dark">Home</a>
        <a href="cadastro.html" class="btn btn--dark">Cadastre-se</a>
      </nav>
    </div>
  </header>

  <main class="login-page">
    <div class="form-card">
      <h1 class="form-card__title">Entrar</h1>
      <p class="form-card__subtitle">Acesse sua conta para entrar na plataforma.</p>

      <form id="loginForm">
        <div class="form-field">
          <label class="form-field__label" for="email">Email</label>
          <input class="form-field__input" type="email" id="email" required />
        </div>

        <div class="form-field">
          <label class="form-field__label" for="password">Senha</label>

          <div class="password-field">
            <input
              class="form-field__input password-field__input"
              type="password"
              id="password"
              required
            />
            <button type="button" id="togglePassword" class="password-field__toggle"></button>
          </div>
        </div>

        <button type="submit" class="btn btn--purple btn--full">Entrar</button>

        <div id="loginError" class="form-feedback--error"></div>

        <div class="form-footer">
          Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
