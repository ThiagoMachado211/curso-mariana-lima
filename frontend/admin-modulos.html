<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Módulos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="admin-page admin-dashboard-page">
    <header class="site-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="index.html" class="site-logo">
            <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>
          <nav class="site-nav">
            <a href="admin-dashboard.html" class="btn btn--dark" style="background-color:lightgrey; color:black;">Voltar para o dashboard</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="admin-management-main">
      <div class="admin-management-container">
        <h1 class="admin-management-title">Gerenciamento de Módulos</h1>

        <div id="messageBox"></div>

        <section class="card">
          <h2 id="formTitle">Novo módulo</h2>

          <form id="moduleForm">
            <div class="row">
              <div>
                <label for="course_id">Curso</label>
                <select id="course_id">
                  <option value="">Selecione um curso</option>
                </select>
              </div>

              <div>
                <label for="order">Ordem</label>
                <input type="number" id="order" />
              </div>

              <div class="full-width">
                <label for="title">Título do módulo</label>
                <input type="text" id="title" />
              </div>
            </div>

            <div class="actions">
              <button type="submit">Salvar módulo</button>
              <button id="cancelEditButton" class="secondary hidden" type="button">Cancelar edição</button>
            </div>
          </form>
        </section>

        <section class="card">
          <h2>Lista de módulos</h2>
          <div id="modulesList" class="admin-list-stack">
            <p class="empty-state">Nenhum módulo cadastrado até o momento.</p>
          </div>
        </section>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-modulos.js"></script>
  </body>
</html>
