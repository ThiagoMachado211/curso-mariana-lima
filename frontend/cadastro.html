<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Matemática Essencial</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body {
      background: #000;
      color: #fff;
      min-height: 100%;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    input {
      font-size: 16px;
    }

    .blue {
      color: #3b82f6;
    }

    .purple {
      color: #a855f7;
    }

    .text-soft {
      color: #cfcfcf;
    }

    .text-soft-2 {
      color: #bdbdbd;
    }

    .error-text {
      color: #f87171;
      font-size: 14px;
    }

    .success-text {
      color: #4ade80;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header style="width: 100%; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000;">
    <div style="width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; justify-content: space-between;">
      <a href="index.html" style="display: flex; align-items: center; gap: 12px; font-weight: bold;">
        <div style="width: 34px; height: 34px; border-radius: 8px; background: #fff; color: #7c3aed; display: flex; align-items: center; justify-content: center; font-weight: bold;">
          ▶
        </div>
        <div style="font-size: 18px;">
          <span class="blue">Matemática</span><span class="purple">Essencial</span>
        </div>
      </a>

      <nav style="display: flex; gap: 12px;">
        <a
          href="login.html"
          style="display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: 12px; background: #0a0a0a; color: #fff; border: 1px solid rgba(255,255,255,0.08); font-weight: 600;"
        >
          Entrar
        </a>
      </nav>
    </div>
  </header>

  <main style="min-height: calc(100vh - 72px); display: flex; align-items: center; justify-content: center; padding: 40px 24px;">
    <div style="width: 100%; max-width: 500px; background: #0b0b0b; border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 32px;">
      <h1 style="font-size: 32px; margin-bottom: 10px;">Criar conta</h1>
      <p class="text-soft-2" style="margin-bottom: 24px;">Preencha seus dados para acessar a plataforma.</p>

      <form id="registerForm">
        <div style="margin-bottom: 16px;">
          <label for="nome" style="display: block; font-size: 14px; margin-bottom: 8px; color: #e5e5e5;">Nome</label>
          <input
            type="text"
            id="nome"
            required
            style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #111; color: #fff; padding: 0 14px;"
          />
        </div>

        <div style="margin-bottom: 16px;">
          <label for="email" style="display: block; font-size: 14px; margin-bottom: 8px; color: #e5e5e5;">Email</label>
          <input
            type="email"
            id="email"
            required
            style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #111; color: #fff; padding: 0 14px;"
          />
        </div>

        <div style="margin-bottom: 16px;">
          <label for="telefone" style="display: block; font-size: 14px; margin-bottom: 8px; color: #e5e5e5;">Telefone</label>
          <input
            type="text"
            id="telefone"
            required
            style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #111; color: #fff; padding: 0 14px;"
          />
        </div>

        <div style="margin-bottom: 16px;">
          <label for="cpf" style="display: block; font-size: 14px; margin-bottom: 8px; color: #e5e5e5;">CPF</label>
          <input
            type="text"
            id="cpf"
            required
            style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #111; color: #fff; padding: 0 14px;"
          />
        </div>

        <div style="margin-bottom: 16px;">
          <label for="password" style="display: block; font-size: 14px; margin-bottom: 8px; color: #e5e5e5;">Senha</label>
          <input
            type="password"
            id="password"
            required
            style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #111; color: #fff; padding: 0 14px;"
          />
        </div>

        <div style="margin-bottom: 16px;">
          <label for="confirmPassword" style="display: block; font-size: 14px; margin-bottom: 8px; color: #e5e5e5;">Confirmar senha</label>
          <input
            type="password"
            id="confirmPassword"
            required
            style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #111; color: #fff; padding: 0 14px;"
          />
        </div>

        <button
          type="submit"
          style="width: 100%; margin-top: 8px; height: 48px; border-radius: 12px; background: #a855f7; color: #fff; font-weight: 600;"
        >
          Criar conta
        </button>

        <div id="registerError" class="error-text" style="margin-top: 14px;"></div>
        <div id="registerSuccess" class="success-text" style="margin-top: 14px;"></div>

        <div class="text-soft" style="margin-top: 18px; font-size: 14px;">
          Já tem conta? <a href="login.html" class="purple" style="font-weight: 700;">Entrar</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
