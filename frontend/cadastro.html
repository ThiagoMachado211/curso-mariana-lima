<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Matemática Essencial</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>



  <body class="public-page register-page">
    <header class="site-header">
      <div class="page-container site-header__inner">
        <a href="index.html" class="site-logo">
          <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
          <span class="site-logo__text">
            <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
          </span>
        </a>

        <nav class="site-nav">
          <a href="login.html" class="btn btn--dark">Entrar</a>
        </nav>
      </div>
    </header>

    <main class="register-page">
      <div class="form-card">
        <h1 class="form-card__title">Criar conta</h1>
        <p class="form-card__subtitle">Preencha seus dados para acessar a plataforma.</p>

        <form id="registerForm">
          <div class="form-field">
            <label class="form-field__label" for="nome">Nome</label>
            <input class="form-field__input" type="text" id="name" required />
          </div>

          <div class="form-field">
            <label class="form-field__label" for="email">Email</label>
            <input class="form-field__input" type="email" id="email" required />
          </div>

          <div class="form-field">
            <label class="form-field__label" for="password">Senha</label>
            <input class="form-field__input" type="password" id="password" required />
          </div>

          <div class="form-field">
            <label class="form-field__label" for="confirmPassword">Confirmar senha</label>
            <input class="form-field__input" type="password" id="confirmPassword" required />
          </div>

          <button type="submit" class="btn btn--purple btn--full">Criar conta</button>

          <div id="registerError" class="form-feedback--error"></div>
          <div id="registerSuccess" class="form-feedback--success"></div>

          <div class="form-footer">
            Já tem conta? <a href="login.html">Entrar</a>
          </div>
        </form>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>
  </body>
</html>
