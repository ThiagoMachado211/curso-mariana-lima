<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard do Aluno</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="student-page">
    <header class="site-header student-top-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="dashboard.html" class="site-logo">
            <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <a href="curso.html" class="btn btn--dark">Curso</a>
            <a href="perfil.html" class="btn btn--dark">Perfil</a>
            <button id="logoutButton" class="btn btn--dark" type="button">Sair</button>
          </nav>
        </div>
      </div>
    </header>

    <main class="student-main">
      <div class="student-container">
        <h1 class="student-page-title">Dashboard do Aluno</h1>

        <div id="messageBox" class="student-message"></div>

        <section class="student-card">
          <h2>Boas-vindas</h2>
          <p id="welcomeText">Carregando informações do aluno...</p>
        </section>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
