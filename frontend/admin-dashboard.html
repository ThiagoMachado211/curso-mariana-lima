<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Administrador</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="admin-page admin-dashboard-page">
  <header class="site-header">
    <div class="page-container">
      <div class="site-header__inner">
        <a href="index.html" class="site-logo">
          <img
            src="assets/Logo_Mariana.jpg"
            alt="Logo Mariana Lima"
            class="site-logo__img"
          />
          <span class="site-logo__text">
            <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
          </span>
        </a>

        <nav class="site-nav">
          <a id="logoutButton" class="btn btn--dark" href="login.html" style="width:100px; background-color: grey;">  Sair  </a>
<!--          <button id="logoutButton" class="btn btn--dark">Sair</button> -->
        </nav>
      </div>
    </div>
  </header>

  <main class="admin-dashboard-main">
    <div class="admin-dashboard-container">
      <section class="admin-dashboard-hero">
   <h1 class="admin-dashboard-title">Área do Administrador: Gerenciamento</h1>
<!---   <p class="admin-dashboard-subtitle">
          Gerencie cursos, módulos, aulas, matrículas e acompanhe os cadastros realizados.
        </p>
-->
      </section>

      <section class="admin-management-section">
        <div class="admin-management-grid">
          <a href="admin-cursos.html" class="admin-management-card">
            <h2>Número de Cursos Cadastrados: <strong id="countCourses" class="admin-metric-value">0</strong> </h2>
          </a>
        </div>

        <div class="admin-management-grid">
          <a href="admin-modulos.html" class="admin-management-card">
            <h2>Número de Módulos Cadastrados: <strong id="countModules" class="admin-metric-value">0</strong> </h2>
          </a>
        </div>

        <div class="admin-management-grid">
          <a href="admin-aulas.html" class="admin-management-card">
            <h2>Número de Aulas Cadastradas: <strong id="countLessons" class="admin-metric-value">0</strong> </h2>
          </a>
        </div>

        <div class="admin-management-grid">
          <a href="admin-cadastros.html" class="admin-management-card">
            <h2>Número de Cadastros Ativos: <strong id="countUsers" class="admin-metric-value">0</strong> </h2>
          </a>
        </div>

      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
