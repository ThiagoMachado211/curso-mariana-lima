<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Dashboard</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="index.html" class="site-logo">
            <img
              src="assets/Logo_Mariana.jpg"
              alt="Logo Mariana Lima"
              class="site-logo__img"
            />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática </span><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <button id="logoutButton" class="btn btn--dark" type="button">Sair</button>
          </nav>
        </div>
      </div>
    </header>

    <main class="admin-page">
      <section class="admin-dashboard-hero">
        <h1>Administrador: Dashboard</h1>
      </section>

      <section class="admin-dashboard-actions">
        <a href="admin-cursos.html" class="dashboard-admin-btn">
          Cursos Ativos (Quantidade: <span id="coursesCount">0</span>)
        </a>

        <a href="admin-modulos.html" class="dashboard-admin-btn">
          Módulos Ativos (Quantidade: <span id="modulesCount">0</span>)
        </a>

        <a href="admin-aulas.html" class="dashboard-admin-btn">
          Aulas Ativas (Quantidade: <span id="lessonsCount">0</span>)
        </a>

        <a href="admin-cadastros.html" class="dashboard-admin-btn">
          Cadastros Ativos (Quantidade: <span id="activeUsersCount">0</span>)
        </a>

        <a href="admin-bloqueados.html" class="dashboard-admin-btn dashboard-admin-btn--danger">
          Usuários Bloqueados (Quantidade: <span id="blockedUsersCount">0</span>)
        </a>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/admin-dashboard.js"></script>
  </body>
</html>
