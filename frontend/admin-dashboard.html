<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrador: Dashboard</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="admin-header">
    <div class="admin-header-left">
      <img src="./assets/logo.png" alt="Logo" class="logo" />
      <span class="brand-name">MatemáticaEssencial</span>
    </div>

    <div class="admin-header-right">
      <button id="logoutButton" class="header-btn danger-btn" type="button">Sair</button>
    </div>
  </header>

  <main class="admin-page">
    <section class="page-title-section">
      <h1>Administrador: Dashboard</h1>
    </section>

    <section class="cards-list">
      <article class="admin-card">
        <div class="admin-card-content">
          <h3>Número de Cursos Cadastrados: <span id="totalCourses">0</span></h3>
        </div>
      </article>

      <article class="admin-card">
        <div class="admin-card-content">
          <h3>Número de Módulos Cadastrados: <span id="totalModules">0</span></h3>
        </div>
      </article>

      <article class="admin-card">
        <div class="admin-card-content">
          <h3>Número de Aulas Cadastradas: <span id="totalLessons">0</span></h3>
        </div>
      </article>

      <article class="admin-card">
        <div class="admin-card-content">
          <h3>Número de Cadastros Ativos: <span id="totalUsers">0</span></h3>
        </div>
      </article>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/admin-dashboard.js"></script>
</body>
</html>
