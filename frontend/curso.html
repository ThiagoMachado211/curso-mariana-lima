<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curso do Aluno</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="student-page">
    <header class="site-header student-top-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="dashboard.html" class="site-logo">
            <img
              src="assets/Logo_Mariana.jpg"
              alt="Logo Mariana Lima"
              class="site-logo__img"
            />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática </span>
              <span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>

          <nav class="site-nav">
            <a href="dashboard.html" class="btn btn--dark">Dashboard</a>
            <a href="perfil.html" class="btn btn--dark">Perfil</a>
            <button id="logoutButton" class="btn btn--dark" type="button">Sair</button>
          </nav>
        </div>
      </div>
    </header>

    <main class="course-page">
      <section id="courseMainContent" class="course-player-section">
        <!-- MODO VÍDEO -->
        <div id="videoMode" class="lesson-mode">
          <div class="course-video-wrapper">
            <iframe
              id="lessonPlayer"
              class="lesson-player"
              src=""
              title="Player da aula"
              frameborder="0"
              allowfullscreen
            ></iframe>
          </div>
        </div>

        <!-- MODO PDF -->
        <div id="pdfMode" class="lesson-mode hidden">
          <div class="course-pdf-wrapper">
            <div class="course-pdf-placeholder">
              <h2 id="pdfLessonTitle">Selecione uma aula</h2>
              <div id="pdfButtonsContainer" class="pdf-buttons-container">
                <!-- Botões dos PDFs serão inseridos via JS -->
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="course-sidebar">
        <h2>Conteúdo do curso</h2>

        <div class="sidebar-card">
          <div id="modulesList" class="modules-list">
            <div class="sidebar-loading">Carregando módulos e aulas...</div>
          </div>

          <p id="courseProgressText">Carregando progresso...</p>
          <div class="progress-bar">
            <div id="courseProgressFill" class="progress-bar-fill"></div>
          </div>
        </div>
      </aside>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/curso.js"></script>
  </body>
</html>
