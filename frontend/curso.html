<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curso - Matemática Essencial</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>



  <body class="public-page course-page">
    <header class="site-header">
      <div class="page-container site-header__inner">
        <a href="index.html" class="site-logo">
          <img src="assets/Logo_Mariana.jpg" alt="Logo Mariana Lima" class="site-logo__img" />
          <span class="site-logo__text">
            <span class="site-logo__text--blue">Matemática</span><span class="site-logo__text--purple">Essencial</span>
          </span>
        </a>

        <nav class="site-nav">
          <a href="dashboard.html" class="btn btn--dark">Dashboard</a>
