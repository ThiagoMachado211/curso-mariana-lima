<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aula</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 18px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .page {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 20px;
      align-items: start;
    }

    .main-content {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      padding: 20px;
    }

    .sidebar {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      padding: 18px;
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 60px);
      overflow-y: auto;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #475569;
    }

    .btn-secondary:hover {
      background: #334155;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .lesson-title {
      font-size: 28px;
      font-weight: bold;
      margin: 0 0 8px 0;
    }

    .lesson-meta {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .section {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .pdf-link {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .pdf-link:hover {
      text-decoration: underline;
    }

    .sidebar-title {
      margin: 0 0 14px 0;
      font-size: 20px;
    }

    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lesson-item {
      display: block;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      color: #0f172a;
      background: #fff;
      transition: 0.2s;
    }

    .lesson-item:hover {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .lesson-item.active {
      border-color: #2563eb;
      background: #dbeafe;
    }

    .lesson-item-order {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .lesson-item-title {
      font-size: 15px;
      font-weight: bold;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
    }

    .empty-video {
      color: white;
      padding: 20px;
    }

    .nav-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 1000px) {
      .page {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Conteúdo da aula</h1>
  </header>

  <div id="breadcrumb" style="margin-bottom: 10px; font-size: 14px; color: #64748b;"></div>
  <div id="lesson-context-card" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 18px; margin-bottom: 18px;">
    <div id="lesson-context-top" style="font-size: 14px; color: #64748b; margin-bottom: 8px;"></div>
    <div id="lesson-context-title" style="font-size: 28px; font-weight: bold; color: #0f172a;"></div>
  </div>

  <div class="page">
    <main class="main-content">
      <div class="top-actions">
        <button id="btn-back-module" class="btn btn-secondary">Voltar para módulo</button>
        <button id="btn-back-course" class="btn btn-secondary">Voltar para curso</button>
        <a href="cursos.html" class="btn btn-secondary">Ir para cursos</a>
      </div>

      <div id="message-container"></div>

      <h2 id="lesson-title" class="lesson-title">Carregando aula...</h2>
      <p id="lesson-meta" class="lesson-meta"></p>

      <div id="video-container" class="video-wrapper"></div>

      <div class="section">
        <h3>Material complementar</h3>
        <div id="pdf-container"></div>
      </div>

      <div class="nav-actions">
        <button id="btn-prev-lesson" class="btn btn-secondary">← Aula anterior</button>
        <button id="btn-next-lesson" class="btn">Próxima aula →</button>
      </div>
    </main>

    <aside class="sidebar">
      <h3 class="sidebar-title">Aulas do módulo</h3>
      <div id="sidebar-lessons" class="lesson-list"></div>
    </aside>
  </div>

  <script src="js/api.js"></script>
  <script src="js/aula.js"></script>
</body>
</html>
