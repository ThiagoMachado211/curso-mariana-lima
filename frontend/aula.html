<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aula</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 0;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Conteúdo da aula</h1>
  </header>

  <main>
    <div class="actions">
      <button id="btn-back-module" class="btn">Voltar para módulo</button>
      <a href="cursos.html" class="btn">Ir para cursos</a>
    </div>

    <div id="message-container"></div>

    <h2 id="lesson-title">Carregando aula...</h2>
    <p id="lesson-meta"></p>

    <div id="video-container" class="video-wrapper"></div>

    <section>
      <h3>Material complementar</h3>
      <div id="pdf-container"></div>
    </section>
  </main>

  <script src="js/aula.js"></script>
</body>
</html>
