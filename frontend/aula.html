<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>


  
  <body class="student-page lesson-page">
    <header>
      <h1>Conteúdo da aula</h1>
    </header>

    <div id="breadcrumb" style="margin-bottom: 10px; font-size: 14px; color: #64748b;"></div>
    <div id="lesson-context-card" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 18px; margin-bottom: 18px;">
      <div id="lesson-context-top" style="font-size: 14px; color: #64748b; margin-bottom: 8px;"></div>
      <div id="lesson-context-title" style="font-size: 28px; font-weight: bold; color: #0f172a;"></div>
    </div>

    <div class="page">
      <main class="main-content">
        <div class="top-actions">
          <button id="btn-back-module" class="btn btn-secondary">Voltar para módulo</button>
          <button id="btn-back-course" class="btn btn-secondary">Voltar para curso</button>
          <a href="cursos.html" class="btn btn-secondary">Ir para cursos</a>
        </div>

        <div id="message-container"></div>

        <h2 id="lesson-title" class="lesson-title">Carregando aula...</h2>
        <p id="lesson-meta" class="lesson-meta"></p>

        <div id="video-container" class="video-wrapper"></div>

        <div class="section">
          <h3>Material complementar</h3>
          <div id="pdf-container"></div>
        </div>

        <div class="nav-actions">
          <button id="btn-prev-lesson" class="btn btn-secondary">← Aula anterior</button>
          <button id="btn-next-lesson" class="btn">Próxima aula →</button>
        </div>
      </main>

      <aside class="sidebar">
        <h3 class="sidebar-title">Aulas do módulo</h3>
        <div id="sidebar-lessons" class="lesson-list"></div>
      </aside>
    </div>

    <script src="js/api.js"></script>
    <script src="js/aula.js"></script>
  </body>
</html>
