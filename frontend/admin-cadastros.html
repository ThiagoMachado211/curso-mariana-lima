<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Cadastros</title>
    <link rel="stylesheet" href="./css/admin.css" />
  </head>
  <body class="admin-page">
    <header class="site-header">
      <div class="page-container">
        <div class="site-header__inner">
          <a href="index.html" class="site-logo">
            <img
              src="assets/Logo_Mariana.jpg"
              alt="Logo Mariana Lima"
              class="site-logo__img"
            />
            <span class="site-logo__text">
              <span class="site-logo__text--blue">Matemática </span
              ><span class="site-logo__text--purple">Essencial</span>
            </span>
          </a>
          <nav class="site-nav">
            <a href="admin-dashboard.html" class="btn btn--light">
              Voltar para o dashboard
            </a>
          </nav>
        </div>
      </div>
    </header>

    <main class="admin-management-main">
      <div class="admin-management-container">
        <section class="page-intro">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 16px;
              flex-wrap: wrap;
            "
          >
            <div>
              <h2 style="margin-bottom: 6px;">Gerenciamento de usuários</h2>
              <p>
                Crie, edite, gerencie matrículas e visualize apenas usuários
                ativos.
              </p>
            </div>

            <button
              id="openCreateUserModalButton"
              class="primary-btn"
              type="button"
            >
              Novo cadastro
            </button>
          </div>
        </section>

        <section id="feedbackMessage" class="feedback hidden"></section>

        <section class="card">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Nome Completo</th>
                  <th>E-mail</th>
                  <th>Perfil</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="usersList">
                <tr>
                  <td colspan="4" class="empty-state">Carregando usuários...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <div id="userModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="userModalTitle">Novo cadastro</h2>
          <button
            type="button"
            id="closeUserModalButton"
            class="icon-close-btn"
          >
            ×
          </button>
        </div>

        <form id="userForm" class="form-grid">
          <input type="hidden" id="userId" />

          <div class="form-row">
            <label for="name">Nome</label>
            <input type="text" id="name" required />
          </div>

          <div class="form-row">
            <label for="lastName">Sobrenome</label>
            <input type="text" id="lastName" required />
          </div>

          <div class="form-row">
            <label for="email">E-mail</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-row" id="passwordRow">
            <label for="password">Senha</label>
            <input type="password" id="password" minlength="6" />
          </div>

          <div class="form-row">
            <label for="role">Perfil</label>
            <select id="role" required>
              <option value="student">Aluno</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="form-row">
            <label for="isActive">Status</label>
            <select id="isActive">
              <option value="true">Ativo</option>
              <option value="false">Inativo</option>
            </select>
          </div>

          <div class="modal-actions">
            <button
              type="button"
              id="cancelUserModalButton"
              class="secondary-btn"
            >
              Cancelar
            </button>
            <button type="submit" id="saveUserButton" class="primary-btn">
              Salvar
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="enrollmentModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content modal-lg">
        <div class="modal-header">
          <div>
            <h2>Gerenciar matrículas</h2>
            <p id="enrollmentStudentName" class="modal-subtitle"></p>
          </div>
          <button
            type="button"
            id="closeEnrollmentModalButton"
            class="icon-close-btn"
          >
            ×
          </button>
        </div>

        <div class="enrollment-layout">
          <section class="enrollment-panel">
            <h3>Matricular em curso</h3>
            <div class="inline-form">
              <select id="courseSelect"></select>
              <button id="enrollButton" type="button" class="primary-btn">
                Matricular
              </button>
            </div>
          </section>

          <section class="enrollment-panel">
            <h3>Matrículas do aluno</h3>
            <div id="studentEnrollmentsList" class="enrollment-list"></div>
          </section>
        </div>

        <div class="modal-actions">
          <button
            type="button"
            id="closeEnrollmentFooterButton"
            class="secondary-btn"
          >
            Fechar
          </button>
        </div>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/admin-cadastros.js"></script>
  </body>
</html>
